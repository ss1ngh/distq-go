syntax = "proto3";

package distq;

//Tells the Go protoc plugin where to output the generated code package
option go_package = "github.com/ss1ngh/distq-go/internal/pb";

//JobQueue service exposes our core remote procedure calls over HTTP/2
service JobQueue {
  rpc Enqueue (EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue (DequeueRequest) returns (DequeueResponse);
  // Complete marks a job as successfully finished (the old Ack, renamed:
  // success and failure are both explicit outcomes now).
  rpc Complete (CompleteRequest) returns (CompleteResponse);
  // Fail reports a handler failure; the SERVER decides retry-vs-DLQ
  // and tells the worker what happened via `retrying`.
  rpc Fail (FailRequest) returns (FailResponse);
}

// Core Job structure representing a background task
message Job {
  string id = 1;
  string type = 2;
  bytes payload = 3;
  string status = 4;
  string error = 5;
  // Retry bookkeeping — the server owns these, the worker only reads them.
  int32 retry_count = 6;
  int32 max_retries = 7;
}

// Enqueue RPC structures
message EnqueueRequest {
  Job job = 1;
}

message EnqueueResponse {
  string job_id = 1;
  string error = 2;
}

// Dequeue RPC structures
message DequeueRequest {
  string worker_id = 1;
}

message DequeueResponse {
  Job job = 1;
  string error = 2;
}

// Complete RPC structures
message CompleteRequest {
  string job_id = 1;
}

message CompleteResponse {
  string error = 1;
}

// Fail RPC structures
message FailRequest {
  string job_id = 1;
  string error_message = 2;
}

message FailResponse {
  // true = job was re-queued with backoff; false = job exceeded max retries and is in the DLQ.
  bool retrying = 1;
  string error = 2;
}
