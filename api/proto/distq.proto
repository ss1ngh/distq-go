syntax = "proto3";

package distq;

//Tells the Go protoc plugin where to output the generated code package
option go_package = "github.com/ss1ngh/distq-go/internal/pb";

//JobQueue service exposes our core remote procedure calls over HTTP/2
service JobQueue {
  rpc Enqueue (EnqueueRequest) returns (EnqueueResponse);
  rpc Dequeue (DequeueRequest) returns (DequeueResponse);
  // Complete marks a job as successfully finished (the old Ack, renamed:
  // success and failure are both explicit outcomes now).
  rpc Complete (CompleteRequest) returns (CompleteResponse);
  // Fail reports a handler failure; the SERVER decides retry-vs-DLQ
  // and tells the worker what happened via `retrying`.
  rpc Fail (FailRequest) returns (FailResponse);
  // Heartbeat renews a job's lease while its worker is still working on it, so
  // a slow job is not mistaken for a dead worker.
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

// Core Job structure representing a background task
message Job {
  string id = 1;
  string type = 2;
  bytes payload = 3;
  string status = 4;
  string error = 5;
  // Retry bookkeeping — the server owns these, the worker only reads them.
  int32 retry_count = 6;
  int32 max_retries = 7;
}

// Enqueue RPC structures
message EnqueueRequest {
  Job job = 1;
}

message EnqueueResponse {
  string job_id = 1;
  string error = 2;
}

// Dequeue RPC structures
message DequeueRequest {
  // Identifies the worker asking for work. Required: the job is leased to this
  // id for a fixed period, and only this worker may then Complete or Fail it.
  string worker_id = 1;
}

message DequeueResponse {
  Job job = 1;
  string error = 2;
  // How long the worker owns the job it was just handed, so it knows how often
  // to renew.
  int32 lease_seconds = 3;
}

// Complete RPC structures
message CompleteRequest {
  string job_id = 1;
  // The worker the job is leased to. Completion from anyone else is refused, so
  // a worker that stalled past its lease cannot overwrite the result of the
  // worker the job was handed to after it was reassigned.
  string worker_id = 2;
}

message CompleteResponse {
  string error = 1;
}

// Fail RPC structures
message FailRequest {
  string job_id = 1;
  string error_message = 2;
  // The worker the job is leased to; see CompleteRequest.worker_id.
  string worker_id = 3;
}

message FailResponse {
  // true = job was re-queued with backoff; false = job exceeded max retries and is in the DLQ.
  bool retrying = 1;
  string error = 2;
}

// Heartbeat RPC structures
message HeartbeatRequest {
  string job_id = 1;
  string worker_id = 2;
}

message HeartbeatResponse {
  // false = the lease is gone: the job was reassigned and this worker has to
  // stop working on it.
  bool ok = 1;
  string error = 2;
}
